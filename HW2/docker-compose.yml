version: "3.8"

services:
  master:
    build: .
    container_name: hadoop-hw2
    hostname: master
    tty: true
    stdin_open: true
    ports:
      - "8020:8020"   # HDFS RPC
      - "9870:9870"   # HDFS WebUI
      - "9864:9864"   # DataNode da
      - "8033:8033"   # YARN Scheduler RPC
      - "28088:8088"  # YARN WebUI
      - "9083:9083"   # Hive Metastore
      - "10000:10000" # HiveServer2 (Beeline)
    volumes:
      - ./data:/data
      - ./setup_hive.sh:/data/setup_hive.sh 

